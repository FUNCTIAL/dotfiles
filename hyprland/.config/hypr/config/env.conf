#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

# Cursor
env = XCURSOR_THEME,phinger-cursors-light
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,phinger-cursors-light
env = HYPRCURSOR_SIZE,24
cursor {
no_hardware_cursors = true
}

# GPU Select https://wiki.hypr.land/Configuring/Multi-GPU/
env = AQ_DRM_DEVICES,/dev/dri/amd-igpu:/dev/dri/nvidia-dgpu
# env = AQ_DRM_DEVICES,/dev/dri/amd-igpu
# env = __EGL_VENDOR_LIBRARY_FILENAMES,/usr/share/glvnd/egl_vendor.d/50_mesa.json

# Nvidia
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
